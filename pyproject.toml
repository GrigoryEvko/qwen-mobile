# The environment of the quantization pipeline in quant/. uv.lock pins the
# full graph. Install it with:
#
#   uv sync --frozen
#   uv run --frozen pytest quant/tests
#
# The direct dependencies are the versions of the environment that produced
# the results in analysis/. torch comes from the CUDA 13 index of PyTorch.
# gguf is the gguf-py package of the llama.cpp submodule, with the patch
# series applied (scripts/apply-patches.sh). sentencepiece and protobuf are
# imports of convert_hf_to_gguf.py, which quant/run.py starts as a subprocess.
#
# The group "corpus" holds the one package that reads a corpus from the network.
# It is not a dependency of the pipeline, because the calibration file
# data/calib-128x2048.pt is the input of every measured run.
#
# Each release of datasets caps fsspec below 2026.7.0, the version of the
# environment that produced the results in analysis/. Thus the group conflicts
# with the group dev, and uv.lock resolves it in a fork of its own. The default
# install keeps every pin of the environment of the results. The corpus fork
# takes fsspec 2025.10.0. Run it in a temporary environment, because a sync of
# the fork removes the group dev from the environment that it syncs:
#
#   uv run --frozen --isolated --no-dev --group corpus python -m quant.run quantize ...
#
# A command that changes this file must keep pyproject.toml and uv.lock in
# agreement in one commit. A uv run or uv sync without --frozen relocks a lock
# that disagrees, and it syncs the shared .venv to the new lock.

[project]
name = "qwen-mobile-quant"
version = "0.1.0"
description = "The quantization pipeline of Qwen3.5 for the Snapdragon phone"
requires-python = ">=3.12"
dependencies = [
    "torch==2.12.0",
    "transformers==5.8.1",
    "numpy==2.4.4",
    "safetensors==0.7.0",
    "gguf",
    "sentencepiece==0.2.1",
    "protobuf==6.33.6",
]

[dependency-groups]
dev = [
    "atheris==3.1.0",
    "hypothesis==6.168.0",
    "pytest==9.0.3",
]
# quant/calib.py reads the C4 corpus with this package when the cache file is absent.
corpus = [
    "datasets==4.5.0",
]

[tool.uv]
# quant/ is not a distribution: the tests import it from the repository root.
package = false
# The group corpus resolves apart from the group dev. Refer to the header of this file.
conflicts = [[{ group = "dev" }, { group = "corpus" }]]

[tool.uv.sources]
gguf = { path = "third_party/llama.cpp/gguf-py", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# The tests that need no phone, no weights and no container. tests/fuzz and tests/suite have their
# own drivers, thus they are not here.
testpaths = ["quant/tests", "tools/trace/tests"]
pythonpath = ["."]
