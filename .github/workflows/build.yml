# The same scripts as on a laptop, on ubuntu-latest: scripts/build-native.sh in
# the Snapdragon container (a public image), scripts/build-apk.sh in the
# container of ci/Containerfile, and the pipeline environment with uv. Podman
# is on the ubuntu-latest runner, and the scripts fall back to docker.
#
# The signed APK on a runner has a new debug key on each run, because the
# runner has no ~/.android/debug.keystore. The unsigned APK and the native
# libraries are the comparable artifacts.
#
# This workflow and the release workflow produce the same two hash tables,
# hashes-native.txt and hashes-apk.txt, thus one artifact of each workflow
# decides whether the two builds gave the same bytes. Two conditions make the
# tables comparable, and both are in the apk job:
#   - The job reads the hash table of the native job. scripts/build-apk.sh
#     compares that table against android/snapdragon/jniLibs and refuses a
#     stale library, thus the table must travel with the libraries.
#   - The checkout has the full history. versionCode is the number of commits
#     of the branch, it goes into the manifest of the APK, and a checkout of
#     depth 1 counts one commit.

name: build

on:
  push:
    # A push to main runs the same scripts in the release workflow.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the native libraries in the Snapdragon container
        run: scripts/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-native
          path: build/hashes-native.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/snapdragon/jniLibs

  apk:
    name: APK and unit tests
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android/snapdragon/jniLibs
      - uses: actions/download-artifact@v4
        with:
          name: hashes-native
          path: build
      - name: Build the APK and run the unit tests in the pinned container
        run: scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-apk
          path: build/hashes-apk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/apk/app-release-unsigned.apk
            build/apk/app-release.apk
            build/apk/test-results

  pipeline:
    # The lock holds torch with CUDA 13 wheels. The download is several GB,
    # and the runner has approximately 14 GB of free disk space.
    name: Python tests of the pipeline and the trace tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - name: Apply the patch series (gguf-py is a path dependency)
        run: scripts/apply-patches.sh
      - name: Install the locked environment
        run: uv sync --frozen
      # tools/trace holds the one tested tool of the profiling kit, and
      # htp_trace.py needs the standard library only.
      - name: Run the tests
        run: uv run --frozen pytest quant/tests tools/trace/tests
