# The version of the app. The release workflow reads versionName from this
# file and tags the commit v<versionName> when that tag does not exist yet.
# Thus a change of this line releases, and every other push to main only
# refreshes the rolling build of the branch.
#
# versionCode must increase for each published version. The build scripts
# pass the number of commits of the branch, and a build without a git
# directory takes the fallback below.
versionName=0.1.0
versionCodeFallback=1
